name: Execute notebook via ARC

on:
  push:
    branches:
      - development
    paths:
      - 'notebooks/**'

jobs:
  run-notebook-in-development-environment:
    runs-on: arc-mlops
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Execute notebook against Kubeflow
      env:
        KFP_ENDPOINT: http://ml-pipeline.kubeflow.svc.cluster.local:8888
      run: |       
        # Execute the Jupyter Notebook and overwrite the existing file with the results
        jupyter nbconvert --execute --to notebook --inplace notebooks/demo-pipeline.ipynb
