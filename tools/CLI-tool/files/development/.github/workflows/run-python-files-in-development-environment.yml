name: Submit pipeline from Python via ARC

on:
  push:
    branches:
      - development
    paths:
      - 'src/**'
    
jobs:
  run-files-in-development-environment:
    runs-on: arc-mlops
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Submit pipeline to Kubeflow
      env:
        KFP_ENDPOINT: http://ml-pipeline.kubeflow.svc.cluster.local:8888
      run: |       
        python src/submit_run.py
