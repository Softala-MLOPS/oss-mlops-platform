workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'

# Apply to all jobs to ensure they run in the correct environment
default:
  image: python:3.8
  tags:
    - self-hosted

stages:
  - test
  - build
  - trigger-kubeflow

# Step 1: Run tests using Pytest
test-python-files:
  stage: test
  script:
    - echo "🚀 Running Pytest for Development..."
    # Create and activate virtual environment
    - python3 -m venv venv
    - source venv/bin/activate
    # Install dependencies into the virtual environment
    - pip install --upgrade pip
    - if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi
    - pip install pytest
    # Run tests
    - pytest src/ || echo "No tests provided or tests passed"
  rules:
    - changes:
        - "src/**/*"

# Step 2: Build Docker image
build-docker-image:
  stage: build
  script:
    - echo "🐳 Building Docker image on Local Runner..."
    - docker build -t mlops-dev-image:latest . || echo "No Dockerfile found, skipping build."
  rules:
    - changes:
        - "src/**/*"
        - "Dockerfile"

# Step 3.1: Run Python pipeline and submit to Kubeflow
run-python-files-in-development:
  stage: trigger-kubeflow
  script:
    - echo "⚙️ Submitting Pipeline via Python files to Local Kubeflow..."
    # Create and activate virtual environment
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install kfp~=1.8.14
    - python src/submit_run.py
  rules:
    - changes:
        - "src/**/*"

# Step 3.2: Run Notebook and submit to Kubeflow
run-notebook-in-development:
  stage: trigger-kubeflow
  script:
    - echo "📓 Running Notebook Pipeline on Local Kubeflow..."
    # Create and activate virtual environment
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install jupyter kfp~=1.8.14
    - jupyter nbconvert --execute --to notebook --inplace notebooks/demo-pipeline.ipynb
  artifacts:
    name: "executed-notebook-$CI_COMMIT_SHORT_SHA"
    paths:
      - notebooks/demo-pipeline.ipynb
    expire_in: 1 week
  rules:
    - changes:
        - "notebooks/**/*"