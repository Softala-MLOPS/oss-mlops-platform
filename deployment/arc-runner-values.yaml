# Values for the Actions Runner Controller runner scale set chart.
# githubConfigUrl and scaling settings are overridden by scripts/install_arc_runner.sh.
githubConfigSecret: arc-github-secret
runnerScaleSetName: arc-mlops
runnerGroup: default
minRunners: 0
maxRunners: 2

controllerServiceAccount:
  namespace: arc-system
  name: arc-gha-rs-controller

template:
  spec:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.0
        command:
          - /home/runner/run.sh
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL