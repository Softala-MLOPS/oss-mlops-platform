name: ARC in-cluster runner demo

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - arc-runner-and-gitlab-runner

permissions:
  contents: read

jobs:
  run-demo-pipeline:
    runs-on: arc-mlops
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Submit and wait for demo pipeline
        env:
          KFP_ENDPOINT: http://ml-pipeline.kubeflow.svc.cluster.local:8888
          KFP_WAIT_FOR_RUN_COMPLETION: "true"
          KFP_RUN_TIMEOUT_SECONDS: "5400"
        working-directory: tools/CLI-tool/files/development
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../common/requirements.txt
          python src/submit_run.py
